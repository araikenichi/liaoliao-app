<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiaoLiao - AI媒人マッチングアプリ</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/main.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loader">
            <i class="fas fa-heart fa-beat"></i>
            <p>Loading...</p>
        </div>
    </div>

    <!-- App Container -->
    <div id="app" class="app-container" style="display: none;">

        <!-- Auth Screen -->
        <div id="auth-screen" class="screen active">
            <div class="auth-container">
                <div class="auth-header">
                    <i class="fas fa-heart logo-icon"></i>
                    <h1 class="app-title">LiaoLiao</h1>
                    <p class="app-subtitle">AI があなたの運命の人を見つけます</p>
                </div>

                <!-- Login Form -->
                <div id="login-form" class="auth-form">
                    <h2>ログイン</h2>
                    <div class="form-group">
                        <label>メールアドレス</label>
                        <input type="email" id="login-email" placeholder="example@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>パスワード</label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>
                    <button class="btn btn-primary" onclick="app.auth.login()">
                        <i class="fas fa-sign-in-alt"></i> ログイン
                    </button>
                    <p class="form-switch">
                        アカウントをお持ちでない方は <a href="#" onclick="app.auth.showRegister(); return false;">新規登録</a>
                    </p>
                </div>

                <!-- Register Form -->
                <div id="register-form" class="auth-form" style="display: none;">
                    <h2>新規登録</h2>
                    <div class="form-group">
                        <label>メールアドレス</label>
                        <input type="email" id="register-email" placeholder="example@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>パスワード</label>
                        <input type="password" id="register-password" placeholder="••••••••（8文字以上）" required>
                    </div>
                    <div class="form-group">
                        <label>表示名</label>
                        <input type="text" id="register-name" placeholder="ニックネーム" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>年齢</label>
                            <input type="number" id="register-age" placeholder="25" min="18" max="100" required>
                        </div>
                        <div class="form-group">
                            <label>性別</label>
                            <select id="register-gender" required>
                                <option value="">選択してください</option>
                                <option value="male">男性</option>
                                <option value="female">女性</option>
                                <option value="other">その他</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>自己紹介</label>
                        <textarea id="register-bio" placeholder="自分について簡単に紹介してください..." rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>趣味・興味（カンマ区切り）</label>
                        <input type="text" id="register-interests" placeholder="例: 旅行, 読書, 料理" required>
                    </div>
                    <button class="btn btn-primary" onclick="app.auth.register()">
                        <i class="fas fa-user-plus"></i> 登録する
                    </button>
                    <p class="form-switch">
                        すでにアカウントをお持ちの方は <a href="#" onclick="app.auth.showLogin(); return false;">ログイン</a>
                    </p>
                </div>
            </div>
        </div>

        <!-- Main App Screen -->
        <div id="main-screen" class="screen">
            <!-- Navigation Bar -->
            <nav class="navbar">
                <div class="nav-container">
                    <div class="nav-brand">
                        <i class="fas fa-heart"></i>
                        <span>LiaoLiao</span>
                    </div>
                    <div class="nav-menu">
                        <button class="nav-item active" data-tab="ai-chat">
                            <i class="fas fa-robot"></i>
                            <span>AI仲人</span>
                        </button>
                        <button class="nav-item" data-tab="matches">
                            <i class="fas fa-fire"></i>
                            <span>マッチング</span>
                        </button>
                        <button class="nav-item" data-tab="messages">
                            <i class="fas fa-comment"></i>
                            <span>メッセージ</span>
                        </button>
                        <button class="nav-item" data-tab="profile">
                            <i class="fas fa-user"></i>
                            <span>プロフィール</span>
                        </button>
                    </div>
                    <button class="btn-logout" onclick="app.auth.logout()">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </nav>

            <!-- Content Area -->
            <div class="content">
                <!-- AI Chat Tab -->
                <div id="ai-chat-tab" class="tab-content active">
                    <div class="chat-container">
                        <div class="chat-header">
                            <div class="chat-avatar">
                                <i class="fas fa-robot"></i>
                            </div>
                            <div class="chat-info">
                                <h3>AI仲人アシスタント</h3>
                                <p>あなたの理想のパートナーを見つけるお手伝いをします</p>
                            </div>
                        </div>
                        <div id="ai-messages" class="chat-messages">
                            <!-- Messages will be dynamically added here -->
                        </div>
                        <div class="chat-input">
                            <input type="text" id="ai-message-input" placeholder="メッセージを入力..." onkeypress="if(event.key==='Enter') app.ai.sendMessage()">
                            <button class="btn-send" onclick="app.ai.sendMessage()">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Matches Tab -->
                <div id="matches-tab" class="tab-content">
                    <div class="matches-header">
                        <h2>あなたへのおすすめ</h2>
                        <button class="btn btn-primary" onclick="app.matching.findMatches()">
                            <i class="fas fa-sync"></i> 新しい相手を探す
                        </button>
                    </div>
                    <div id="matches-list" class="matches-grid">
                        <!-- Match cards will be dynamically added here -->
                    </div>
                </div>

                <!-- Messages Tab -->
                <div id="messages-tab" class="tab-content">
                    <div class="messages-header">
                        <h2>メッセージ</h2>
                    </div>
                    <div id="conversations-list" class="conversations-list">
                        <div class="empty-state">
                            <i class="fas fa-comments"></i>
                            <p>まだメッセージはありません</p>
                            <small>マッチングが成立すると、ここに表示されます</small>
                        </div>
                    </div>
                </div>

                <!-- Profile Tab -->
                <div id="profile-tab" class="tab-content">
                    <div class="profile-container">
                        <div class="profile-header">
                            <div class="profile-avatar">
                                <i class="fas fa-user-circle"></i>
                            </div>
                            <h2 id="profile-name">Loading...</h2>
                            <p id="profile-age-gender">-</p>
                        </div>
                        <div class="profile-section">
                            <h3><i class="fas fa-quote-left"></i> 自己紹介</h3>
                            <p id="profile-bio">-</p>
                        </div>
                        <div class="profile-section">
                            <h3><i class="fas fa-heart"></i> 趣味・興味</h3>
                            <div id="profile-interests" class="tags">
                                <!-- Tags will be added here -->
                            </div>
                        </div>
                        <div class="profile-section">
                            <h3><i class="fas fa-brain"></i> AI分析</h3>
                            <div id="profile-ai-analysis" class="ai-analysis">
                                <p class="text-muted">AI仲人との会話を通じて、あなたの性格や価値観を分析します。</p>
                            </div>
                        </div>
                        <button class="btn btn-secondary" onclick="app.profile.editProfile()">
                            <i class="fas fa-edit"></i> プロフィールを編集
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ai.js"></script>
    <script src="/js/matching.js"></script>
    <script src="/js/profile.js"></script>
    <script src="/js/main.js"></script>

    <script>
        // Initialize app when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
